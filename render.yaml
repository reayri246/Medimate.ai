databases:
  - name: medimate-db
    databaseName: medimate
    user: medimate
    plan: free

services:
  - type: web
    name: medimate-ai
    runtime: python
    buildCommand: apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tel && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: USE_POSTGRES
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: medimate-db
          property: connectionString
      - key: TRUST_X_FORWARDED_PROTO
        value: "True"
