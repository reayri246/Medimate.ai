{% extends 'base.html' %}

{% block title %}Login | MediMate AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 p-4">
      <h2 class="mb-3">Welcome back</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <div class="mt-3 text-center">
        <small>Need an account? <a href="{% url 'register' %}">Register</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
